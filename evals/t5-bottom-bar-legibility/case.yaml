schema_version: "1.1"
name: t5-bottom-bar-legibility
tags: [trigger, positive]
runs: 5
execution:
  max_turns: 2
  timeout_seconds: 180
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    The text on my translucent bottom bar is hard to read in dark mode on iOS 27. How do I fix it?
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?liquid-glass"'
