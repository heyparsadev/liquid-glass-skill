schema_version: "1.1"
name: t4-swiftui-toolbar-done
tags: [trigger, positive]
runs: 5
execution:
  max_turns: 2
  timeout_seconds: 180
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    Write a SwiftUI toolbar for iOS 26 with a Done button as the primary action.
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?liquid-glass"'
