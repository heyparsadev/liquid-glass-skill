schema_version: "1.1"
name: t2-settings-redesign-ios26
tags: [trigger, positive]
runs: 5
execution:
  max_turns: 2
  timeout_seconds: 180
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    I'm redesigning my iPhone app's settings screen for iOS 26. How should the navigation bar and the buttons look?
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?liquid-glass"'
