schema_version: "1.1"
name: t1-what-is-liquid-glass
tags: [trigger, positive]
runs: 5
execution:
  max_turns: 2
  timeout_seconds: 180
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    What is Liquid Glass, and where should I use it in my iPhone app?
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?liquid-glass"'
